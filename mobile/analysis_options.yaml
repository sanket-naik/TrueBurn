include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # lib/core/ must never reach for a clock or a plugin; these keep the discipline
    # that lets the engine be proven headlessly.
    avoid_print: true
    prefer_const_constructors: true
    prefer_final_locals: true
